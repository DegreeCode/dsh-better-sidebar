name: Release

# Builds the plugin and attaches the packed tarball to a GitHub release.
#
# Trigger: pushing a tag vX.Y.Z. The tag MUST match package.json `version`.
#
# Why a tarball: lib/ is gitignored, so installing straight from the git
# repository makes pnpm run the package's build scripts, which DSH profiles
# block (ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED). The release tarball already
# carries the built lib/, so it installs without running any script:
#
#   dsh plugin --profile web add https://github.com/DegreeCode/dsh-better-sidebar/releases/download/vX.Y.Z/dsh-better-sidebar-X.Y.Z.tgz
#
# npm publishing is left out: the `dsh-better-sidebar` npm package belongs to
# the upstream repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Tests run git log against this repository and need full history.
          fetch-depth: 0

      # pnpm version is pinned via packageManager in package.json; the action
      # reads it from there (specifying both makes action-setup fail on
      # purpose with ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The plugin's git revert/cherry-pick spawn git without an identity
      # (see tests/smoke.spec.ts); the runner has none by default.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "dsh-better-sidebar-ci"
          git config --global user.email "ci@dsh.invalid"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check consumer type surface
        run: pnpm check:consumer-types

      - name: Pack
        id: pack
        run: |
          pnpm pack
          file="dsh-better-sidebar-$(node -p "require('./package.json').version").tgz"
          tar -tzf "$file" | grep -qx 'package/lib/client-registry.js' || { echo "::error::$file is missing lib/"; exit 1; }
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
